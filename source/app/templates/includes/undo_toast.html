{# Nach dem Ausblenden (Liste oder Galerie) einige Sekunden „Rückgängig“ anbieten (app.js) #}
<div class="pointer-events-none fixed inset-x-0 bottom-[calc(1.25rem+env(safe-area-inset-bottom))] z-50 flex justify-center px-4" role="status">
  <div class="pointer-events-auto flex items-center gap-3 rounded-full bg-ink py-1.5 pr-1.5 pl-4.5 text-ui text-canvas shadow-[0_8px_30px_rgba(0,0,0,0.25)]" data-undo hidden>
    <span>Ausgeblendet</span>
    <button class="cursor-pointer rounded-full px-3 py-1.5 font-semibold text-canvas hover:bg-canvas/15" type="button" data-undo-button>Rückgängig</button>
  </div>
</div>
