{#
  Nach dem Ausblenden (Wischen, Auge oder Galerie) kurz unten „Ausgeblendet · Rückgängig“ (app.js offerUndo).
  Gleitet von unten herein (data-show) und nach einigen Sekunden wieder hinaus.
#}
{% import "includes/ui.html" as ui %}
<div class="pointer-events-none fixed inset-x-0 bottom-[calc(1.25rem+env(safe-area-inset-bottom))] z-50 flex justify-center px-4" role="status">
  <div class="pointer-events-auto flex translate-y-4 items-center gap-2.5 rounded-full bg-ink py-1.5 pr-1.5 pl-4 text-ui text-canvas opacity-0 shadow-[0_8px_30px_rgba(0,0,0,0.25)] transition duration-200 ease-out data-show:translate-y-0 data-show:opacity-100 motion-reduce:transition-none [&>svg]:opacity-70" data-undo hidden>
    {{ ui.icon('eye-off') }}<span>Ausgeblendet</span>
    <button class="cursor-pointer rounded-full px-3 py-1.5 font-semibold text-canvas hover:bg-canvas/15 active:bg-canvas/25" type="button" data-undo-button>Rückgängig</button>
  </div>
</div>
